overview: "Movie metadata for fanedits from the Internet Fanedit Database (IFDB)"
description: >
  Fetches metadata and images for fanedits from fanedit.org: title, synopsis and changes,
  fan editor, original film, genres, fanedit type, release date, runtime, ratings, posters,
  backdrops and trailers. Matches automatically during library scans.
category: "Metadata"
owner: "raetha"
artifacts:
- "Jellyfin.Plugin.Ifdb.dll"
- "HtmlAgilityPack.dll"
changelog: >
  Requires Jellyfin 12. (Jellyfin 10.11 servers get version 1.11.0, with the same fixes and features.)
  Rewritten for the current fanedit.org site, fixing searches that returned nothing (issue #2):
  requests send a User-Agent, read the current page layout, follow single-result redirects, and log
  clearly when fanedit.org's bot protection blocks them. Unidentified movies are now matched
  automatically with fuzzy title scoring. Adds trailers, cover art, backdrops, fanedit type and
  franchise tags, the Changes section in the overview, an IFDB link, an optional IMDb id, request
  spacing and caching, and a settings page. Fixes Trusted Reviewer ratings showing as a
  single-digit critic percentage.
