name: '🔬 Run CodeQL'

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@master
    with:
      repository-name: raetha/Jellyfin.Plugin.IFDB
      dotnet-version: '9.0.x'
