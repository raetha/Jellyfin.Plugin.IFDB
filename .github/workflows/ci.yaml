name: 'CI'

# Builds, tests (with a 100% coverage gate) and packages the plugin on every push and pull
# request. The release workflow calls this too, so nothing is published without passing it.
#
# The .NET SDK follows build.yaml's "framework", so the same workflow serves branches that
# target different Jellyfin versions (net9.0 for Jellyfin 10.11, net10.0 for Jellyfin 12).

on:
  push:
    branches: [main, dev, 'jellyfin-*']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main, dev, 'jellyfin-*']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Four-part plugin version to package (defaults to build.yaml)'
        type: string
        default: ''
    outputs:
      zip:
        description: 'File name of the packaged plugin zip in the "plugin" artifact'
        value: ${{ jobs.package.outputs.zip }}

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build.yaml
        id: plugin
        run: |
          version=$(grep -Po '^version:\s*"?\K[0-9.]+' build.yaml)
          framework=$(grep -Po '^framework:\s*"?\K[a-z0-9.]+' build.yaml)
          props=$(grep -Po '<Version>\K[0-9.]+' Directory.Build.props)
          if [ "$version" != "$props" ]; then
            echo "::error file=Directory.Build.props::Version $props doesn't match build.yaml's $version"
            exit 1
          fi
          echo "framework=${framework}" >> "$GITHUB_OUTPUT"
          echo "sdk=${framework#net}.x" >> "$GITHUB_OUTPUT"
          echo "Plugin ${version} for ${framework}"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.plugin.outputs.sdk }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - name: Build (analyzer warnings are errors)
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test --configuration Release --no-build -p:CollectCoverage=true --logger "console;verbosity=normal"

      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage.cobertura.xml') != ''
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.* >/dev/null
          reportgenerator -reports:coverage/coverage.cobertura.xml -targetdir:coverage/report -reporttypes:MarkdownSummaryGithub >/dev/null
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Test release scripts
        working-directory: scripts
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: CHANGELOG.md has notes for this version
        run: |
          version=$(grep -Po '^version:\s*"?\K[0-9.]+' build.yaml)
          node scripts/changelog.js notes "$version" > /dev/null

  package:
    name: Package
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      zip: ${{ steps.files.outputs.zip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build.yaml
        id: plugin
        run: |
          framework=$(grep -Po '^framework:\s*"?\K[a-z0-9.]+' build.yaml)
          echo "framework=${framework}" >> "$GITHUB_OUTPUT"
          echo "sdk=${framework#net}.x" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.plugin.outputs.sdk }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      # The plugin's own changelog (shown by Jellyfin) comes from CHANGELOG.md, not build.yaml.
      - name: Put the release notes in build.yaml
        run: |
          (cd scripts && npm ci --no-audit --no-fund)
          version=$(grep -Po '^version:\s*"?\K[0-9.]+' build.yaml)
          node scripts/changelog.js build-yaml "$version" build.yaml

      - name: Build plugin package
        id: jprm
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          version: ${{ inputs.version }}
          dotnet-target: ${{ steps.plugin.outputs.framework }}

      - name: Checksums
        id: files
        run: |
          zip=$(realpath "${{ steps.jprm.outputs.artifact }}")
          mkdir -p dist
          cp "$zip" dist/
          name=$(basename "$zip")
          (cd dist && md5sum "$name" | cut -d' ' -f1 > "${name%.zip}.md5" && sha256sum "$name" | cut -d' ' -f1 > "${name%.zip}.sha256")
          echo "zip=${name}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: dist/
          if-no-files-found: error
